[package]
name = "agent"
version = "0.10.12"
edition = "2024"

[dependencies]
common = { path = "../common" }
# everything OS-specific (sessions, locking, notifications, users, web filter)
platform = { path = "../platform" }

# async runtime
tokio = { version = "1", features = ["full"] }

# websocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# TLS crypto provider for wss:// (cloud mode). rustls 0.23 + ring needs the
# process-default provider installed explicitly; aws-lc-rs is avoided so the
# musl release build stays simple.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# sqlite
rusqlite = { version = "0.32", features = ["bundled"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# config file
toml = "0.8"

# error handling
anyhow = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# random (pairing code)
rand = "0.8"

# mDNS server discovery. Linux only: the macOS agent is always pointed at its
# server explicitly (--server-url or --cloud-account).
[target.'cfg(target_os = "linux")'.dependencies]
mdns-sd = "0.11"
