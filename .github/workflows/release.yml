name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" crates/agent/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" crates/server/Cargo.toml

      - name: Build agent
        run: cross build --release -p agent --target ${{ matrix.target }}

      - name: Build server
        run: cross build --release -p server --target ${{ matrix.target }}

      - name: Build tray
        run: cross build --release -p tray --target ${{ matrix.target }}

      - name: Stage binaries
        run: |
          ARCH=$(echo "${{ matrix.target }}" | cut -d- -f1)
          mkdir -p dist
          cp target/${{ matrix.target }}/release/agent                    dist/screenguard-agent-${ARCH}
          cp target/${{ matrix.target }}/release/parental-controller-server dist/screenguard-server-${ARCH}
          cp target/${{ matrix.target }}/release/screenguard-tray          dist/screenguard-tray-${ARCH}
          chmod +x dist/screenguard-agent-${ARCH} dist/screenguard-server-${ARCH} dist/screenguard-tray-${ARCH}
          sha256sum dist/screenguard-agent-${ARCH}  | awk '{print $1}' > dist/screenguard-agent-${ARCH}.sha256
          sha256sum dist/screenguard-server-${ARCH} | awk '{print $1}' > dist/screenguard-server-${ARCH}.sha256
          sha256sum dist/screenguard-tray-${ARCH}   | awk '{print $1}' > dist/screenguard-tray-${ARCH}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/

  build-macos:
    name: Build (macOS ${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i '' "s/^version = \".*\"/version = \"${VERSION}\"/" crates/agent/Cargo.toml

      # Only the agent: the server and web UI are deployed on Linux, and there
      # is no macOS tray application.
      - name: Build agent
        run: cargo build --release -p agent --target ${{ matrix.target }}

      # Native arch only: the runners are Apple silicon, so the x86_64 build is
      # a cross-compile whose tests could not be executed here.
      - name: Test
        if: matrix.arch == 'arm64'
        run: cargo test --release -p agent -p platform -p common --target ${{ matrix.target }}

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/agent dist/screenguard-agent-macos-${{ matrix.arch }}
          chmod +x dist/screenguard-agent-macos-${{ matrix.arch }}
          shasum -a 256 dist/screenguard-agent-macos-${{ matrix.arch }} \
            | awk '{print $1}' > dist/screenguard-agent-macos-${{ matrix.arch }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/

  release:
    name: Publish release
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Bundle deploy files
        run: |
          cp deploy/screenguard-server.service dist/
          cp deploy/screenguard-agent.service  dist/
          cp deploy/screenguard-webui.service  dist/
          cp deploy/screenguard-tray.desktop   dist/
          cp deploy/screenguard-dbus.conf      dist/
          cp deploy/org.screenguard.agent.plist dist/
          cp install.sh dist/
          cp install-macos.sh dist/
          tar -czf dist/screenguard-webui.tar.gz \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -C webui .

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
